name: Test and publish NAS image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - run: node --test test/*.test.mjs

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/herowoo/c11-harbor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Build ARM64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: c11-harbor:smoke
          build-args: APP_REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha
      - name: Verify ARM64 service starts with an empty data directory
        run: |
          trap 'docker rm -f c11-smoke >/dev/null 2>&1 || true' EXIT
          docker run --platform linux/arm64 -d --name c11-smoke \
            -e ADMIN_PASSWORD=ci-local-smoke-password \
            -p 127.0.0.1:18088:8080 c11-harbor:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18088/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs c11-smoke
          exit 1
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
